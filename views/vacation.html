<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Vacations</title>

    <link rel = "icon" href="images/cool-vacation.png">

    <link rel="stylesheet" href="styles/styles.css">

    <script src="scripts/vacation.js" defer></script>
</head>
<body>

    <div id = "main">

        <div id = "header">

            <img src="images/banner.jpeg">
            <h1>Book Your Dream Vacation</h1>

        </div>

        <form id="vacation-form" action = "/find-vacation" method = "post">

            <!--Destination DROP DOWN-->

            <fieldset>

                <legend>Destination</legend>

                <span class="err" id ="err-destination">Please select a destination</span>
                
                <select id = "destination" name = "destination">
                    <option value = "none"> -- Choose a destination -- </option>

                    <option value = "bali"> Bali, Indonesia </option>

                    <option value = "paris"> Paris, France </option>

                    <option value = "tokyo"> Tokyo, Japan </option>

                    <option value = "seattle"> Seattle, Washington </option>

                    <option value = "florida"> Tampa Bay, Florida </option>
                </select>

            </fieldset>


            <!--Departure date INPUT TYPE="DATE"-->
            <fieldset>

                <legend>Departure Date</legend>

                <input type="date" id = "departure" name = "departure-date" value = "departure">

            </fieldset>

            <!--Traveler number INPUT TYPE = NUMBER-->
            <fieldset>
                <legend>Number of Travelers</legend>
                <span class="err" id ="err-travelers">Travelers must be greater than 0</span>

                <input type="number" id = "travelers" name = "traveler-num">

            </fieldset>

            <button type="submit" id="find-vacation">Find my Vacation</button>

        </form>


    </div>

    <footer>

        <div class = "footer-content">

            <h4>GitHub Repository: https://github.com/LucidIsDreaming/vacation.git</h4>

        </div>

    </footer>

    
</body>
</html>
